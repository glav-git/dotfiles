[accessibility]
ui_scale = 1.1
[hooks]
colors_changed = [
    "copyq exit || true; copyq --start-server",
    """pkill Telegram && hyprctl dispatch 'hl.dsp.exec_cmd("uwsm app -- Telegram", {no_initial_focus=true})'""",
]

[plugins]
enabled = ["pphaver/mega_cmd_sync_status"]

[[plugins.source]]
name     = "local-custom-plugins"
kind     = "path"
location = "~/.config/noctalia/custom_plugins"
enabled  = true

[bar.default]
shadow = false
start = [ "workspaces"]
center = [ "clock" ]
end = [ "media", "spacer_1", "mega", "tray", "notifications", "group:g1", "battery" ]
concave_edge_corners = true
margin_edge = 0
margin_ends = 0
radius_bottom_left = 0
radius_bottom_right = 0
radius_top_left = 0
radius_top_right = 0
scale = 1
thickness = 28
background_opacity = 0.7

    [[bar.default.capsule_group]]
    border = ""
    fill = "on_secondary"
    id = "g1"
    members = [ "temp", "sysmon_2", "sysmon_3" ]
    opacity = 0
    padding = 1.0

[shell]
lang = "en"
clipboard_image_action_command = "swash --stdin --name \"swash-$(date +'%Y-%m-%d_%H:%M:%S').png\""
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true

    [shell.greeter_sync]
    auto_sync = false

    [shell.panel]
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    copy_to_clipboard = false
    pipe_command = "swash --stdin --name \"swash-$(date +'%Y-%m-%d_%H:%M:%S').png\""
    pipe_to_command = true
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[shell.launcher]
categories = false

[system.monitor]
gpu_poll_seconds = 2

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

[theme.templates]
builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "qt", "alacritty", "hyprland", "starship" ]

[theme.templates.user.brave-origin]
input_path  = "~/.config/noctalia/templates/brave-policy.json"
output_path = "/etc/brave/policies/managed/noctalia-theme.json"
post_hook = 'pgrep -f brave-origin && brave-origin --refresh-platform-policy --no-startup-window'

[widget.clock]
color = "secondary"
# format = "{:%H:%M %A %d-%m-%y}"
format = "{:%H:%M }"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.notifications]
color = "secondary"

[widget.session]
color = "error"

[widget.spacer_1]
type = "spacer"

[widget.temp]
show_value = true

[widget.sysmon_2]
glyph = "gpu-usage"
show_value = false
stat = "gpu_temp"
type = "sysmon"

[widget.sysmon_3]
glyph = "cpu-2"
stat = "ram_used"
type = "sysmon"

[widget.workspaces]
style = "minimal"
occupied_color = "outline"
show_labels = true

[idle.behavior.custom]
timeout = 600
action = "command"
command = "noctalia msg session lock"

[widget.mega]
type = "pphaver/mega_cmd_sync_status:mega_cmd_sync_status"
