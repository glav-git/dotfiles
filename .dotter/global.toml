[helpers]

[default]
depends = []

[default.files]
"bin/mp3_from_mp4.sh" = "~/.local/bin/mp3_from_mp4"
"bin/mp4_to_gif.sh" = "~/.local/bin/mp4_to_gif"
"bin/tmux-sessionizer.sh" = "~/.local/bin/ts"
"bin/webm_to_webp.sh" = "~/.local/bin/webm_to_webp"
"bin/webp_to_gif.sh" = "~/.local/bin/webp_to_gif"
"bin/yt_download.sh" = "~/.local/bin/yt_download"
"bin/yt_fragment_download.sh" = "~/.local/bin/yt_fragment_download"
"bin/ytm-download.sh" = "~/.local/bin/ytm-download"
".bashrc" = { target = "~/.bashrc", type = "template" }
".bash_profile" = "~/.bash_profile"
".gitconfig" = "~/.gitconfig"
"copyq.conf" = "~/.config/copyq/copyq.conf"
"kitty.conf" = "~/.config/kitty/kitty.conf"
cowsay = "~/.config/cowsay"
tmux = "~/.config/tmux"
hypr = "~/.config/hypr"
mise = "~/.config/mise"
noctalia = "~/.config/noctalia"
# I am shocked that this worked exactly how I wanted it to lmao
nvim = "~/.config/nvim"
"nvim/lua/opts.lua" = { target = "~/.config/nvim/lua/opts.lua", type = "template" }

[default.variables]

[settings]
default_target_type = "symbolic"
