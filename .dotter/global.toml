[helpers]

[default]
depends = []

[default.files]
"bin/tmux-sessionizer.sh" = "~/.local/bin/ts"
".bashrc" = { target = "~/.bashrc", type = "template" }
".bash_profile" = "~/.bash_profile"
".gitconfig" = "~/.gitconfig"
"copyq.conf" = "~/.config/copyq/copyq.conf"
cowsay = "~/.config/cowsay"
tmux = "~/.config/tmux"
hypr = "~/.config/hypr"
mise = "~/.config/mise"
noctalia = "~/.config/noctalia"
# I am shocked that this worked exactly how I wanted it to lmao
nvim = "~/.config/nvim"
"nvim/lua/opts.lua" = { target = "~/.config/nvim/lua/opts.lua", type = "template" }

[default.variables]

[settings]
default_target_type = "symbolic"
